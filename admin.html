<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Painel | Ana Macedo</title>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Syne:wght@600;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--plum:#26123a;--plum2:#3a2058;--gold:#c9a45c;--off:#f6f1ea;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--plum);color:var(--off);font:400 16px/1.5 'DM Sans',system-ui,sans-serif;min-height:100svh}
main{max-width:640px;margin:0 auto;padding:24px 18px 60px}
h1{font:400 2.6rem 'Pinyon Script',cursive;color:var(--gold);margin:0}
h2{font:800 1.6rem 'Syne',sans-serif;margin:0 0 14px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
button,input{font:inherit}
.btn{border:0;border-radius:999px;padding:11px 20px;font-weight:500;cursor:pointer;background:var(--gold);color:var(--plum)}
.btn.ghost{background:none;color:var(--off);border:1.5px solid rgba(246,241,234,.4)}
.btn.sm{padding:8px 16px;font-size:.92rem}
.btn:active{transform:scale(.96)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
form{display:grid;gap:14px}
label{display:grid;gap:6px;font-weight:500}
input{padding:13px 16px;border-radius:14px;border:1.5px solid rgba(246,241,234,.3);background:rgba(246,241,234,.08);color:var(--off);width:100%}
.err{color:#f3c8c8;min-height:1.4em;margin:0}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:none}
.tab{flex:none;border:1.5px solid var(--gold);background:none;color:var(--gold);border-radius:999px;padding:8px 16px;cursor:pointer}
.tab.on{background:var(--gold);color:var(--plum)}
.card{background:var(--plum2);border-radius:22px;padding:18px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card h3{font:800 1.15rem 'Syne',sans-serif;margin:0}
.dt{font:600 1rem 'Syne',sans-serif;color:var(--gold);white-space:nowrap}
.card p{margin:6px 0 0;opacity:.9}
.tag{display:inline-block;border:1.5px solid var(--gold);color:var(--gold);border-radius:999px;padding:2px 12px;font-size:.82rem;margin-top:8px}
.st{font-size:.82rem;opacity:.75;margin-top:6px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.vazio{opacity:.75;text-align:center;padding:30px 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<header><h1>Ana Macedo</h1><button class="btn ghost sm" id="sair" hidden>Sair</button></header>

<section id="login">
<h2>Entrar no painel</h2>
<form id="lf">
<label>E-mail<input type="email" id="em" required autocomplete="username"></label>
<label>Senha<input type="password" id="pw" required autocomplete="current-password"></label>
<p class="err" id="le" role="alert"></p>
<button class="btn" type="submit">Entrar</button>
</form>
</section>

<section id="painel" hidden>
<h2>Pedidos de horário</h2>
<div class="tabs" id="tabs"></div>
<div id="ls"></div>
<p style="text-align:center"><button class="btn ghost sm" id="rf">Atualizar</button></p>
</section>
</main>

<script>
const SUPABASE_URL='https://wwxrnyihzdawqfwuomra.supabase.co';
const SUPABASE_KEY='sb_publishable_0yUFMhLXmRMPCquKBH7XIg_MNIRo3CR';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NOMES={pendente:'Pendentes',confirmado:'Confirmados',cancelado:'Cancelados',todos:'Todos'};
let filtro='pendente',lista=[];

function mostrar(logada){$('#login').hidden=logada;$('#painel').hidden=!logada;$('#sair').hidden=!logada}

async function iniciar(){
  const {data:{session}}=await sb.auth.getSession();
  mostrar(!!session);
  if(session)carregar();
}

$('#lf').onsubmit=async e=>{
  e.preventDefault();$('#le').textContent='';
  const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  if(error){$('#le').textContent='E-mail ou senha incorretos.';return}
  $('#pw').value='';mostrar(true);carregar();
};
$('#sair').onclick=async()=>{await sb.auth.signOut();lista=[];mostrar(false)};
$('#rf').onclick=()=>carregar();

async function carregar(){
  const {data,error}=await sb.from('agendamentos').select('*').order('data',{ascending:true}).order('criado_em',{ascending:true});
  if(error){$('#ls').innerHTML='<p class="vazio">Não foi possível carregar os pedidos. '+esc(error.message)+'</p>';return}
  lista=data||[];desenhar();
}

function desenhar(){
  $('#tabs').innerHTML=Object.keys(NOMES).map(k=>{
    const n=k==='todos'?lista.length:lista.filter(a=>a.status===k).length;
    return `<button class="tab ${k===filtro?'on':''}" data-k="${k}">${NOMES[k]} (${n})</button>`}).join('');
  const itens=lista.filter(a=>filtro==='todos'||a.status===filtro);
  if(!itens.length){$('#ls').innerHTML='<p class="vazio">Nenhum pedido aqui por enquanto.</p>';return}
  $('#ls').innerHTML=itens.map(a=>{
    const dia=new Date(a.data+'T12:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'});
    const b=(st,t,cls)=>`<button class="btn sm ${cls||''}" data-id="${esc(a.id)}" data-st="${st}">${t}</button>`;
    const acoes=a.status==='pendente'?b('confirmado','Confirmar')+b('cancelado','Cancelar','ghost')
      :a.status==='confirmado'?b('cancelado','Cancelar','ghost')+b('pendente','Voltar para pendente','ghost')
      :b('pendente','Reabrir','ghost');
    return `<div class="card"><div class="top"><h3>${esc(a.servico)}</h3><span class="dt">${esc(dia)}</span></div>
<p><b>${esc(a.nome)}</b>${a.horario?' · '+esc(a.horario):''}</p>
${a.obs?`<p>${esc(a.obs)}</p>`:''}
${a.vim_pela_sarah?'<span class="tag">Veio pela Sarah</span>':''}
<div class="st">Status: ${esc(a.status)}</div><div class="acts">${acoes}</div></div>`}).join('');
}

$('#tabs').onclick=e=>{const k=e.target.dataset.k;if(k){filtro=k;desenhar()}};
$('#ls').onclick=async e=>{
  const b=e.target.closest('button[data-id]');if(!b)return;
  b.disabled=true;
  const {error}=await sb.from('agendamentos').update({status:b.dataset.st}).eq('id',b.dataset.id);
  if(error){alert('Não foi possível atualizar: '+error.message);b.disabled=false;return}
  carregar();
};
setInterval(()=>{if(!$('#painel').hidden)carregar()},30000);
iniciar();
</script>
</body>
</html>
